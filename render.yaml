# 유료(Starter) + 영구 디스크 구성 — SQLite 와 업로드 이미지가 재배포 후에도 그대로 남습니다.
# Render → New → Blueprint 에서 이 저장소를 연결하면 이 파일이 사용됩니다.
services:
  - type: web
    name: cuberry-landing
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      # 선택: 기본 초기 비밀번호가 그대로면 서버가 뜨지 않게 막는 안전장치.
      # ADMIN_PASSWORD 를 반드시 함께 등록해야 합니다.
      # - key: REQUIRE_ADMIN_PASSWORD
      #   value: "1"
      # 선택: CSP 를 끄려면 빈 문자열을 넣습니다(기본은 화면에 맞춘 CSP 적용).
      # - key: CONTENT_SECURITY_POLICY
      #   value: ""
      # ── 문의 알림(선택) ─────────────────────────────────────────
      # 셋 다 비워두면 알림 기능이 완전히 꺼진 채 지금과 똑같이 동작합니다.
      # 알림을 켜려면 아래 주석을 풀고 값을 등록하세요(resend.dev 는 발신 도메인 검증 필요).
      # - key: NOTIFY_WEBHOOK_URL   # Slack Incoming Webhook 등 POST 한 번으로 알림을 받는 주소
      #   sync: false
      # - key: NOTIFY_EMAIL_TO      # 쉼표로 여러 명. 예) ops@cuberry.ai,ceo@cuberry.ai
      #   sync: false
      # - key: RESEND_API_KEY       # Resend REST 키. 없으면 이메일 채널만 자동으로 꺼집니다 (nodemailer 불필요)
      #   sync: false
      # - key: NOTIFY_EMAIL_FROM    # 기본값 "Cuberry <onboarding@resend.dev>"
      #   sync: false
      # - key: NOTIFY_MASK_CONTACT  # "1" 이면 웹훅 본문의 이메일·전화를 가립니다 (ab***@gmail.com)
      #   value: "1"
      # - key: NOTIFY_DISABLED      # "1" 이면 알림 전체 OFF — 장애 시 즉시 끄는 킬 스위치
      #   value: "1"
      # 선택: 어드민의 "GitHub에 백업 및 배포" 버튼용.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: hanahchafilmaker/Landing_Cuberry
      - key: GITHUB_BRANCH
        value: main
      # GitHub Pages 에 올려둔 랜딩/어드민 화면이 이 서버의 API 를 직접 호출할 수 있게 허용할 Origin.
      # 여러 개는 쉼표로 구분합니다. 예) "https://hanahchafilmaker.github.io,https://cuberry.com"
      # 모든 사이트를 허용하려면 "*" (토큰 인증만 사용하므로 쿠키는 무시됩니다).
      - key: ADMIN_ALLOWED_ORIGINS
        value: https://hanahchafilmaker.github.io
      # ── 문의 알림 (선택) ────────────────────────────────────────────
      # 빈 값이면 채널이 꺼진다 — 전부 비워 두면 알림 없는 기존 동작 그대로.
      # Slack Incoming Webhook 등 범용 웹훅 주소.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      # 이메일 알림: NOTIFY_EMAIL_TO 와 RESEND_API_KEY 를 함께 등록해야 켜집니다.
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # 선택: 킬 스위치 / 서드파티 채널 연락처 마스킹 / 발신자.
      # - key: NOTIFY_DISABLED
      #   value: "1"
      # - key: NOTIFY_MASK_CONTACT
      #   value: "1"
      # - key: NOTIFY_EMAIL_FROM
      #   value: "Cuberry <onboarding@resend.dev>"
    disk:
      name: cuberry-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
