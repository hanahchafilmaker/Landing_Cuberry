services:
  - type: web
    name: cuberry-landing
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: cuberry-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
