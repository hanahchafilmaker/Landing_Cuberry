s system CJ Logistics adopted — from grid storage to robotic picking and the flow from order to dispatch, in 2D·3D motion graphics.","랭키닷컴 런칭 타이포 영상":"Ranky.com Launch Typography Film","랭키닷컴 런칭을 앞두고 브랜드를 표현하는 키워드를 활용해 정체성을 타이포그래피로 풀어낸 2D·3D 모션그래픽입니다.":"Ahead of Ranky.com's launch, brand keywords were turned into typography — a 2D·3D motion graphics piece that spells out the identity.","필립모리스 유해성을 줄인 산업 트렌드":"Philip Morris — Reduced-Harm Industry Trends","유해성을 줄이는 기업들의 노력을 소개합니다. 제로 칼로리 탄산음료 등 산업 전반의 유해성 저감 트렌드를 타이포그래피로 풀어낸 모션그래픽입니다.":"A look at companies working to reduce harm — the industry-wide move toward reduced-risk products, from zero-calorie soft drinks on, expressed through typography.","위더스애드 애니메이션 브랜드 필름":"Withers Ad Animation Brand Film","광고주의 간절함이 불러낸 신비로운 존재라는 은유로 위더스애드의 가치와 방향성을 표현했습니다. 정보 과잉 시대의 해답을 일러스트 애니메이션과 실사 내러티브로 담았습니다.":"A metaphor — a wondrous being summoned by a client's earnestness — expresses Withers Ad's values and direction, answering the age of information overload with illustrated animation and live-action narrative.","리니지 M 백월":"Lineage M Backwall","리니지 M 세트장 백월에 라이브 송출된 영상입니다. 정적인 일러스트에 구름과 빛, 인물의 미세한 움직임과 각종 효과를 더해 살아있는 배경 모션그래픽으로 완성했습니다.":"Footage streamed live onto the back wall of the Lineage M set. Subtle character movement, clouds, light and effects bring a static illustration to life as background motion graphics.","미국 광고 RERE":"US Ad RERE","첨부된 4K 광고 영상입니다. 포트폴리오에서 직접 재생해 영상의 톤과 편집 흐름을 확인할 수 있습니다.":"The 4K commercial attached here. Play it right in the portfolio to check the tone and editing flow.","PD의 기획력과 모션그래퍼의\n크리에이티브가 만나는 팀":`Where a PD's planning meets
