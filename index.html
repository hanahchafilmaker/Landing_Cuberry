has actually delivered`,"TV·웹드라마 같은 방송 작품부터 커머셜, 기업 영상까지. 작품중심·광고·기타 세 갈래로 나눠 실제 납품 작업과 제작 범위를 함께 확인하실 수 있습니다.":"From broadcast work such as TV series and web dramas to commercials and corporate films. Browse it in three views — Craft, Commercial and Other — with the scope of each project.","포트폴리오 분류":"Portfolio category","TV · 웹드라마":"TV · web drama","커머셜 · 브랜드 필름":"Commercial · brand film","기업 · 모션 · 인터뷰":"Corporate · motion · interview","납품 규격(비율·해상도)은 어떻게 정하나요?":"How are the delivery specs (aspect ratio and resolution) decided?","9:16·16:9, 4K·1080p 등 채널별 규격을 기획 단계에서 확정합니다. 매체 규격이 정해져 있으면 그 기준에 맞춰 제작합니다.":"We lock the channel specs (9:16, 16:9, 4K, 1080p and so on) during planning. If your media outlet already has a spec, we produce to that.","수정은 몇 회까지 포함인가요?":"How many rounds of revisions are included?","단발 기준 2회(1차 가편집본, 2차 최종본)가 기본입니다. 기획·스토리보드 컨펌 후 구성(장면·스토리) 변경은 재견적 대상입니다.":"Two rounds as standard (first rough cut, then final): once the plan and storyboard are approved, changes to the composition (scenes or story) require a new estimate.","납품 파일은 어떤 형식으로 받나요?":"What file formats do I receive?","납품 시 확정된 규격(비율·해상도·버전)으로만 출력합니다. 이후 규격 변경이나 추가 버전이 필요하면 재출력 절차를 거쳐야 하므로, 납품 전에 필요한 규격을 모두 확정해 주세요.":"We render only to the specs confirmed before delivery (ratio, resolution and version). Any later spec change or extra version requires a re-render, so please lock every spec you need before delivery.","인물·캐릭터 시트는 매번 새로 만드나요?":"Do you rebuild the character sheets every time?","한 번 만든 인물·배경 시트는 재사용합니다. 신규 인물·공간이 필요할 때만 시트를 새로 제작합니다.":"Character and background sheets are reused once built. New sheets are created only when a new character or location is needed.","AI 생성 결과가 마음에 안 들면 어떻게 하나요?":"What if I don't like the AI-generated result?","씬마다 후보 3~5개를 생성해 선택합니다. 연출·검수 담당이 컷 적합성을 함께 확인합니다.":"We generate three to five candidates per shot and select from them, with the directing and review leads checking how each cut fits.","외국어 버전·더빙도 가능한가요?":"Can you produce foreign-language versions or dubbing?","가능합니다. 언어별 현지화(자막·더빙)로 제작하며 한국어·영어·일본어 납품 이력이 있습니다.":"Yes. We localise per language (subtitles and dubbing) and have delivered Korean, English and Japanese versions.","3D·모션그래픽도 제작하나요?":"Do you also produce 3D and motion graphics?","합니다. 3D 에셋·애니메이션, 모션그래픽·AR 트래킹 합성, 인포그래픽 모션까지 제작합니다.":"We do: 3D assets and animation, motion graphics and AR tracking compositing, and animated infographics.","저작권과 원본 파일은 어떻게 되나요?":"What about copyright and the source files?","저작재산권은 협의된 계약 조건에 따라 의뢰사에 귀속됩니다(라이선스 음원·폰트는 라이선스 범위 내). 마스터·작업 소스는 납품일로부터 3개월 보관합니다.":"Economic copyright transfers to the client under the agreed contract terms (licensed music and fonts stay within their licence). Masters and working sources are kept for three months from the delivery date.","검수는 어떻게 진행되나요?":"How does the review process work?","연출과 분리된 감독 검수를 거칩니다. 글자 깨짐·타사 로고 노출·자막 오탈자·납품 규격을 전수 확인합니다.":"A director reviews the work separately from the production team, checking every frame for broken text, third-party logos, subtitle typos and delivery specs.","어떤 장르를 제작해왔나요?":"Which genres have you produced?","광고(커머셜)·TV·웹드라마 중심으로, 기업 홍보·브랜드 필름·가이드까지 제작했습니다.":"Mainly commercials, TV and web drama, along with corporate films, brand films and guides.","기획·콘티부터 AI 실사 씬 5컷, 편집·색보정, 감독 검수까지":"Script and storyboard, five AI live-action shots, edit, grade and director review","기획 · 콘티":"Script · storyboard","AI 실사 씬 5컷":"5 AI live-action shots","편집 · 색보정 · 자막":"Edit · grade · subtitles","검수 · 9:16 세로":"Review · 9:16 vertical","스토리보드부터 캐릭터 시트, 모션그래픽·사운드까지":"Storyboard, character sheets, motion graphics and sound","캐릭터 시트 관리":"Character sheets","모션그래픽 · 트래킹":"Motion graphics · tracking","기획부터 DI·사운드·감독 검수까지 전 공정, 전담 PM 운영":"Full pipeline from planning to DI, sound and director review, with a dedicated PM","기획 · 스토리보드":"Planning · storyboard","인물 · 배경 시트 세트":"Character · background sheet set","AI 실사 씬 7컷":"7 AI live-action shots","색보정 DI · 사운드":"Colour DI · sound","감독 검수 · 전담 PM":"Director rev ad with illustrated animation and live-action narrative.","리니지 M 백월":"Lineage M Backwall","리니지 M 세트장 백월에 라이브 송출된 영상입니다. 정적인 일러스트에 구름과 빛, 인물의 미세한 움직임과 각종 효과를 더해 살아있는 배경 모션그래픽으로 완성했습니다.":"Footage streamed live onto the back wall of the Lineage M set. Subtle character movement, clouds, light and effects bring a static illustration to life as background motion graphics.","미국 광고 RERE":"US Ad RERE","첨부된 4K 광고 영상입니다. 포트폴리오에서 직접 재생해 영상의 톤과 편집 흐름을 확인할 수 있습니다.":"The 4K commercial attached here. Play it right in the portfolio to check the tone and editing flow.","PD의 기획력과 모션그래퍼의\n크리에이티브가 만나는 팀":`Where a PD's planning meets

        <style>
          .crawler-shell{max-width:960px;margin:0 auto;padding:40px 24px;font-family:'Noto Sans KR',sans-serif;color:#e0e0e0;background:#0e0e0e;line-height:1.7}

        <div class="crawler-shell" role="main" lang="ko">
          <p style="font-size:.85em;color:#666;letter-spacing:.15em">REC · CUBEBERRY · SINCE 2023.08</p>
          <h1>CUBEBERRY · 큐브베리</h1>
          <p style="font-size:1.15em"><strong>Imagine Speaks, AI Completes.</strong></p>
          <p>방송 전문가들이 이끄는 AI 콘텐츠 기업입니다. 우리가 직접 쓰는 도구 XCONDA를 만들고, 그 도구로 지상파에 방영되는 작품을 만듭니다. 특허 등록, KBS 방영작, 해외 업무협약까지 — 만드는 팀과 만드는 도구를 함께 가진 회사.</p>

          <h2>핵심 수치</h2>
          <ul>
            <li><strong>3건</strong> — 특허 등록 · 출원 (KIPO 특허증 기준)</li>
            <li><strong>3편</strong> — KBS 지상파 방영작 (2025–2026)</li>
            <li><strong>4편</strong> — KOCCA 콘텐츠랩 AI 웹드라마 (2026 · 현역 감독 4팀)</li>
            <li><strong>6곳</strong> — 해외 업무협약 (싱가포르 2 · 홍콩 1 · 중국 3)</li>
          </ul>

          <h2>스튜디오</h2>
          <p>기획부터 유통까지, 방영 가능한 완성도로 한 팀이 끝까지 만듭니다.</p>
          <ul>
            <li><strong>방송</strong> — KBS 출신 PD와 지상파 전 채널 집필 작가진, 현업 드라마 감독이 기획과 서사를 맡습니다.</li>
            <li><strong>AI 기술 · XCONDA</strong> — 컷이 바뀌어도 공간과 인물이 유지되는 롱폼 AI 영상 플랫폼을 직접 개발하고 운영합니다.</li>
            <li><strong>제작 스튜디오</strong> — 기획부터 스토리, 생성, 편집, 후반, 유통까지 한 팀이 끝까지 책임집니다.</li>
            <li><strong>오리지널 IP</strong> — 〈전설의 고향〉 REBOOT, 〈토이팜〉 등 자체 세계관을 시즌제와 다국어로 확장합니다.</li>
          </ul>

          <h2>XCONDA 플랫폼</h2>
          <p>큐브베리의 올인원 AI 영상 제작 플랫폼. 14개 이상의 AI 모델을 하나의 흐름으로 연결합니다. TURN·FLEXBOARD·BLOCKING BOARD로 공간·캐릭터·동선을 제작 단계에서 관리합니다.</p>

          <h2>주요 포트폴리오</h2>
          <ul>
            <li>현대건설 기업 홍보 영상 — 미래 스마트시티, 실사 촬영 + CG</li>
            <li>유네코 기업 홍보 영상 — PS Ball 친환경 소재, 실사 + 생성형 AI</li>
            <li>LS전선 기업 홍보 영상 — EV 모터 희토류 영구자석, 모션그래픽</li>
            <li>비치오네 AI 브랜드 필름 — 주얼리 브랜드, 생성형 AI</li>
            <li>CJ대한통운 시리즈 — 오네, 자원 선순환, 친환경 패키징, 오토스토어</li>
