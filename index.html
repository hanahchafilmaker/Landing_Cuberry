          <p style="font-size:1.15em"><strong>Imagine Speaks, AI Completes.</strong></p>
          <p>방송 전문가들이 이끄는 AI 콘텐츠 기업입니다. 우리가 직접 쓰는 도구 XCONDA를 만들고, 그 도구로 지상파에 방영되는 작품을 만듭니다. 특허 등록, KBS 방영작, 해외 업무협약까지 — 만드는 팀과 만드는 도구를 함께 가진 회사.</p>

            <li><strong>6곳</strong> — 해외 업무협약 (싱가포르 2 · 홍콩 1 · 중국 3)</li>
          </ul>

          <ul>
            <li><strong>방송</strong> — KBS 출신 PD와 지상파 전 채널 집필 작가진, 현업 드라마 감독이 기획과 서사를 맡습니다.</li>
            <li><strong>AI 기술 · XCONDA</strong> — 컷이 바뀌어도 공간과 인물이 유지되는 롱폼 AI 영상 플랫폼을 직접 개발하고 운영합니다.</li>
            <li><strong>제작 스튜디오</strong> — 기획부터 스토리, 생성, 편집, 후반, 유통까지 한 팀이 끝까지 책임집니다.</li>
            <li><strong>오리지널 IP</strong> — 〈전설의 고향〉 REBOOT, 〈토이팜〉 등 자체 세계관을 시즌제와 다국어로 확장합니다.</li>
          </ul>

          <h2>XCONDA 플랫폼</h2>
          <p>큐브베리의 올인원 AI 영상 제작 플랫폼. 14개 이상의 AI 모델을 하나의 흐름으로 연결합니다. TURN·FLEXBOARD·BLOCKING BOARD로 공간·캐릭터·동선을 제작 단계에서 관리합니다.</p>

          <h2>주요 포트폴리오</h2>
          <ul>
            <li>현대건설 기업 홍보 영상 — 미래 스마트시티, 실사 촬영 + CG</li>
            <li>유네코 기업 홍보 영상 — PS Ball 친환경 소재, 실사 + 생성형 AI</li>
            <li>LS전선 기업 홍보 영상 — EV 모터 희토류 영구자석, 모션그래픽</li>
            <li>비치오네 AI 브랜드 필름 — 주얼리 브랜드, 생성형 AI</li>
            <li>CJ대한통운 시리즈 — 오네, 자원 선순환, 친환경 패키징, 오토스토어</li>
            <li>한화 에어로스페이스 항공엔진 비전</li>
            <li>2025 고잉 세븐틴 오프닝 타이틀 시퀀스</li>
            <li>〈전설의 고향-구미호〉 — KBS1 어린이날 특집 AI 애니메이션 방영</li>
          </ul>
