        <div class="crawler-shell" role="main" lang="ko">
          <p style="font-size:.85em;color:#666;letter-spacing:.15em">REC · CUBEBERRY · SINCE 2023.08</p>
          <h1>CUBEBERRY · 큐브베리</h1>
          <p style="font-size:1.15em"><strong>Imagine Speaks, AI Completes.</strong></p>
          <p>방송 전문가들이 이끄는 AI 콘텐츠 기업입니다. 우리가 직접 쓰는 도구 XCONDA를 만들고, 그 도구로 지상파에 방영되는 작품을 만듭니다. 특허 등록, KBS 방영작, 해외 업무협약까지 — 만드는 팀과 만드는 도구를 함께 가진 회사.</p>

          <h2>핵심 수치</h2>
