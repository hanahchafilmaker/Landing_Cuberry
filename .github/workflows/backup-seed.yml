name: backup-seed

# Phase 3 — seed.json 백업 자동화 (설계: docs/ops-hardening-plan.md §5)
#
# 서버 안의 setInterval 이 아니라 GitHub Actions 에서 도는 이유:
#   * Render 무료 인스턴스는 15분 무요청이면 잠들어 타이머가 실행되지 않는다.
#   * 깨어나면 data/ 가 비어 있어(= seed.json 에서 재시드) 백업할 것이 없다.
# 저장소 밖에서 6시간마다 두드리면 Sleep 과 무관하게 콘텐츠가 Git 에 남는다.
#
# 준비물: 저장소 → Settings → Secrets and variables → Actions 에 2개를 등록한다.
#   APP_URL      = 운영 서버 주소 (예: https://landing-cuberry-admin.onrender.com)
#   CRON_SECRET  = Render 환경변수 CRON_SECRET 과 **같은 값** (openssl rand -hex 32 권장)
# APP_URL(운영 주소)은 공개 정보지만, 시크릿 2개를 한 곳에서 관리하는 편이 헷갈리지 않는다.
#
# 실패하면 GitHub 이 저장소 소유자에게 메일로 알려준다 — 별도 모니터링 없이 백업 중단을 감지한다.

on:
  schedule:
    - cron: "17 */6 * * *" # 6시간마다 (Render 재시작 주기보다 촘촘하게)
  workflow_dispatch:

permissions:
  contents: read

# 이전 실행이 끝나기 전에 다음이 겹치지 않게 한다(같은 파일을 동시에 커밋하면 충돌한다).
concurrency:
  group: backup-seed
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger seed backup
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::저장소 Secrets 에 APP_URL 과 CRON_SECRET 을 등록하세요 (README '자동 백업' 참고)."
            exit 1
          fi
          # 서버는 200 일 때만 정상이다. 503(CRON_SECRET 미설정) · 401(시크릿 불일치) · 502(GitHub 실패) 는 모두 실패로 처리된다.
          code=$(curl -sS --max-time 90 -o body.json -w '%{http_code}' \
            -X POST "${APP_URL%/}/api/cron/backup" \
            -H "x-cron-secret: $CRON_SECRET")
          cat body.json
          echo
          test "$code" = 200
