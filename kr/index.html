    <meta name="theme-color" content="#0e0e0e" />
    <!-- 한국어 진입용 별칭 페이지 — 실제 한국어 화면은 /(기본) 하나로 관리한다.
         상대경로(../)라 Render 루트(/)와 GitHub Pages 서브경로(…/Landing_Cuberry/) 양쪽에서 동작한다. -->
    <link rel="canonical" href="https://www.cuberry.kr/" />
    <link rel="alternate" hreflang="ko" href="https://www.cuberry.kr/" />
    <link rel="alternate" hreflang="en" href="https://www.cuberry.kr/?lang=en" />

    <title>CUBEBERRY · 큐브베리 — 한국어</title>
    <meta http-equiv="refresh" content="0; url=../?lang=ko" />
    <script>
      // meta refresh 를 못 쓰는 환경을 위한 이중화. 해시(#contact)는 그대로 넘긴다.
      location.replace("../?lang=ko" + location.hash);
    </script>
    <style>

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0e0e;
        color: #edeae2;
        font-family: "Pretendard", "Apple SD Gothic Neo", ui-sans-serif, system-ui, sans-serif;
      }

      p.eyebrow { margin: 0 0 1.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #f4b400; }

      p.copy { margin: 0.75rem 0 1.75rem; font-size: 0.9rem; line-height: 1.7; color: #a9a59b; }
      a { display: inline-block; border: 1px solid #3a3934; padding: 0.7rem 1.1rem; color: #f4b400; text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; }
