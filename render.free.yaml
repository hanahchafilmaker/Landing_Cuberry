# 무료(Free) 구성 — 비용 0원이지만 아래 제약을 반드시 알고 사용하세요.
#
#   * Render 무료 인스턴스는 영구 디스크를 붙일 수 없습니다.
#     → data/cuberry.sqlite 와 data/uploads/ 가 **재배포·재시작마다 사라집니다.**
#   * 15분 동안 요청이 없으면 잠들고, 다음 방문 때 50초 안팎의 콜드 스타트가 걸립니다.
#
# 그래서 콘텐츠 보존은 Git 으로 합니다:
#   1. 어드민 → Settings → Backup → "콘텐츠 JSON 내보내기"
#   2. 내려받은 파일을 server/seed.json 으로 덮어쓰고 커밋·푸시
#   3. 재배포되면 서버가 그 seed.json 으로 다시 시작합니다 (수동 복구 불필요)
#
# 업로드한 이미지는 사라지므로, 무료 구성에서는 이미지 URL 을
# 외부 저장소( drive.google.com 썸네일, CDN 등 ) 절대주소로 넣는 편이 안전합니다.
#
# 배포: Render → New → Blueprint → 저장소 연결 → **Blueprint 파일 경로를 render.free.yaml 로 지정**
services:
  - type: web
    name: cuberry-landing-free
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      # Drive 자동 동기화(선택). 폴더는 비공개로 유지하고 서비스 계정에 뷰어 권한을 부여합니다.
      # 공개할 영상만 개별적으로 링크 공유하세요. 자세한 설정과 키 보안은 README 참고.
      # - key: GOOGLE_DRIVE_FOLDER_ID
      #   sync: false
      # - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
      #   sync: false
      # 선택: 기본 초기 비밀번호가 그대로면 서버가 뜨지 않게 막는 안전장치.
      # ADMIN_PASSWORD 를 반드시 함께 등록해야 합니다.
      # - key: REQUIRE_ADMIN_PASSWORD
      #   value: "1"
      # 선택: CSP 를 끄려면 빈 문자열을 넣습니다(기본은 화면에 맞춘 CSP 적용).
      # - key: CONTENT_SECURITY_POLICY
      #   value: ""
      # ── 문의 알림(선택) ─────────────────────────────────────────
      # 무료 인스턴스는 잠들어 있다 깨어나므로 알림이 곧 "리드를 놓치지 않는 장치"입니다.
      # 셋 다 비워두면 알림 기능이 완전히 꺼진 채 지금과 똑같이 동작합니다.
      # - key: NOTIFY_WEBHOOK_URL   # Slack Incoming Webhook 등 POST 한 번으로 알림을 받는 주소
      #   sync: false
      # - key: NOTIFY_EMAIL_TO      # 쉼표로 여러 명. 예) ops@cuberry.ai,ceo@cuberry.ai
      #   sync: false
      # - key: RESEND_API_KEY       # Resend REST 키 (nodemailer 불필요). 없으면 이메일 채널만 자동으로 꺼집니다
      #   sync: false
      # - key: NOTIFY_MASK_CONTACT  # "1" 이면 웹훅 본문의 이메일·전화를 가립니다
      #   value: "1"
      # - key: NOTIFY_DISABLED      # "1" 이면 알림 전체 OFF — 장애 시 즉시 끄는 킬 스위치
      #   value: "1"
      # ── 스팸 2차 방어(선택, Phase 2) — 등록 안 하면 기본값 flag 로 바로 동작 ──
      # - key: FORM_TOKEN_MODE       # off | flag(기본) | strict — 정책 변경 시에만
      #   value: "flag"
      # - key: TURNSTILE_SECRET      # Cloudflare Turnstile 암호 키 (siteKey 와 함께 등록)
      #   sync: false
      # - key: TURNSTILE_SITE_KEY    # 랜딩 위젯 표시용 공개 키
      #   sync: false
      # 어드민의 "GitHub에 백업 및 배포" 버튼용. 저장소 Contents: Read and write 권한의 fine-grained token.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: hanahchafilmaker/Landing_Cuberry
      - key: GITHUB_BRANCH
        value: main
      # ── 자동 백업(선택, Phase 3) — GitHub Actions 가 6시간마다 POST /api/cron/backup ──
      # 비워 두면 크론 엔드포인트가 503 으로 잠깁니다(수동 백업 버튼은 그대로 동작).
      # GitHub → Settings → Secrets and variables → Actions 에 CRON_SECRET(같은 값)·APP_URL 도 등록하세요.
      # - key: CRON_SECRET
      #   sync: false
      # 공식 도메인(www.cuberry.kr)·apex(cuberry.kr)·GitHub Pages 미러에서 이 서버의 API 를 직접
      # 호출할 수 있게 허용할 Origin. 여러 개는 쉼표로 구분합니다. 모든 사이트를 허용하려면 "*".
      # (서버 기본값에도 두 도메인이 들어 있어 이 항목이 없어도 동작합니다. 값을 바꾸면 재배포 필요.)
      - key: ADMIN_ALLOWED_ORIGINS
        value: https://cuberry.kr,https://www.cuberry.kr,https://hanahchafilmaker.github.io
      # ── 문의 알림 (선택) ────────────────────────────────────────────
      # 빈 값이면 채널이 꺼진다 — 전부 비워 두면 알림 없는 기존 동작 그대로.
      # Slack Incoming Webhook 등 범용 웹훅 주소.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      # 이메일 알림: NOTIFY_EMAIL_TO 와 RESEND_API_KEY 를 함께 등록해야 켜집니다.
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # 선택: 킬 스위치 / 서드파티 채널 연락처 마스킹 / 발신자.
      # - key: NOTIFY_DISABLED
      #   value: "1"
      # - key: NOTIFY_MASK_CONTACT
      #   value: "1"
      # - key: NOTIFY_EMAIL_FROM
      #   value: "Cuberry <onboarding@resend.dev>"
